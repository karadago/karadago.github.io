<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Guessing Game</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --sidebar-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --user-color: #d97706; /* Amber for student's drawn guess */
      --correct-color: #059669; /* Emerald for exact components */
      --resultant-color: #7c3aed; /* Royal Violet for exact resultant */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-color);
      color: var(--text-main);
    }

    /* Canvas Workspace */
    #canvas-container {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
      cursor: default;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Viewport Floating Toolbar */
    .viewport-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      font-size: 13px;
      color: var(--text-muted);
      align-items: center;
      user-select: none;
      z-index: 10;
    }

    .toolbar-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-main);
      font-size: 12px;
    }

    .toolbar-btn:hover {
      background: #e2e8f0;
    }

    /* Sidebar Area */
    #sidebar {
      width: 440px;
      min-width: 390px;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: -4px 0 16px rgba(0,0,0,0.03);
      z-index: 20;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h1 {
      font-size: 17px;
      font-weight: 700;
    }

    .score-badge {
      font-size: 12px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      display: flex;
      gap: 6px;
    }

    /* Game Mode Tabs */
    .mode-nav {
      display: flex;
      padding: 10px 18px 0 18px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      gap: 8px;
    }

    .mode-tab {
      flex: 1;
      padding: 10px 6px;
      font-size: 12.5px;
      font-weight: 700;
      text-align: center;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.15s ease;
      user-select: none;
    }

    .mode-tab:hover {
      color: var(--primary);
    }

    .mode-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Mission & Challenge Cards */
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .challenge-prompt {
      font-size: 13.5px;
      line-height: 1.45;
      font-weight: 500;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="number"] {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      background: #ffffff;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn-submit {
      background: var(--primary);
      color: white;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-next {
      background: #10b981;
      color: white;
    }
    .btn-next:hover {
      background: #059669;
    }

    /* Solution Breakdown Container */
    .solution-panel {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .solution-panel.success {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .solution-panel.warning {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .eval-header {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .math-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-top: 4px;
    }

    .math-table td {
      padding: 4px 0;
    }

    .math-table td:nth-child(1) {
      color: var(--text-muted);
      width: 50%;
    }

    .math-table td:nth-child(2) {
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-weight: 700;
      text-align: right;
    }

    .legend-box {
      display: flex;
      gap: 12px;
      font-size: 11.5px;
      font-weight: 600;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- Graph Canvas Area -->
  <div id="canvas-container">
    <div class="viewport-overlay">
      <button class="toolbar-btn" id="btn-recenter">Recenter</button>
      <button class="toolbar-btn" id="btn-zoom-out">−</button>
      <span id="label-zoom-pct" style="font-weight: 600; min-width: 44px; text-align: center;">100%</span>
      <button class="toolbar-btn" id="btn-zoom-in">+</button>
      <label style="display: flex; align-items: center; gap: 5px; margin-left: 6px; cursor: pointer;">
        <input type="checkbox" id="chk-snap" checked>
        <span>Snap Grid</span>
      </label>
    </div>
    <canvas id="stage"></canvas>
  </div>

  <!-- Sidebar Control & Evaluation Area -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Vector Guessing Game</h1>
      <div class="score-badge">
        <span>Score: <strong id="val-score">0</strong></span>
        <span>|</span>
        <span>Streak: <strong id="val-streak">0</strong></span>
      </div>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="mode-nav">
      <div class="mode-tab active" id="tab-components">1. Rectangular Components</div>
      <div class="mode-tab" id="tab-resultant">2. Resultant Force</div>
    </div>

    <div class="sidebar-content">
      <!-- Challenge Prompt Card -->
      <div class="card">
        <span class="card-title">Challenge Mission</span>
        <div class="challenge-prompt" id="mission-text">Loading challenge...</div>
      </div>

      <!-- Student Input Card -->
      <div class="card" id="input-card">
        <span class="card-title">Your Answer (Drag on screen or enter values)</span>

        <!-- Component Inputs (Shown in Mode 1) -->
        <div id="inputs-components">
          <div class="form-grid">
            <div class="form-group">
              <label>Horizontal F<sub>x</sub> (kN)</label>
              <input type="number" step="0.5" id="user-fx" placeholder="0.0">
            </div>
            <div class="form-group">
              <label>Vertical F<sub>y</sub> (kN)</label>
              <input type="number" step="0.5" id="user-fy" placeholder="0.0">
            </div>
          </div>
        </div>

        <!-- Resultant Inputs (Shown in Mode 2) -->
        <div id="inputs-resultant" style="display: none;">
          <div class="form-grid">
            <div class="form-group">
              <label>Magnitude |R| (kN)</label>
              <input type="number" step="1" id="user-rmag" placeholder="0.0">
            </div>
            <div class="form-group">
              <label>Angle &theta; from +x (0° - 360°)</label>
              <input type="number" step="1" id="user-rangle" placeholder="0°">
            </div>
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <button class="btn btn-submit" id="btn-action">Check Answer</button>

      <!-- Solution Breakdown (Hidden until submitted) -->
      <div class="solution-panel" id="solution-box" style="display: none;">
        <div class="eval-header">
          <span id="eval-title">Evaluation</span>
          <span id="eval-points" style="font-size: 13px;">+100 pts</span>
        </div>
        <p id="eval-desc" style="font-size: 12.5px; color: var(--text-muted);"></p>

        <table class="math-table" id="solution-table">
          <!-- Populated dynamically with step-by-step math -->
        </table>

        <!-- Color Legend for Comparison -->
        <div class="legend-box">
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--user-color);"></span>
            <span>Your Guess</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot" id="dot-correct" style="background: var(--correct-color);"></span>
            <span>Exact Answer</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Constants & Colors
    const GIVEN_COLOR_1 = "#0284c7"; // Primary Blue for F or F1
    const GIVEN_COLOR_2 = "#dc2626"; // Red for F2
    const USER_COLOR = "#d97706";    // Amber for student's drawn guess
    const CORRECT_COLOR = "#059669"; // Emerald for exact components
    const RESULTANT_COLOR = "#7c3aed"; // Royal Violet for exact resultant

    const BASE_ZOOM = 36;

    let state = {
      mode: "components", // 'components' or 'resultant'
      submitted: false,
      score: 0,
      streak: 0,
      dragMode: null, // 'userHandle' or 'pan'
      activeHandle: null, // 'fx', 'fy', or 'resultant'
      view: { panX: 0, panY: 0, zoom: 36, gridSize: 1 },
      dragStart: { x: 0, y: 0 },
      options: { snapToGrid: true },

      // Generated Challenge Data
      challenge: {
        f1: null,
        f2: null,
        exactFx: 0,
        exactFy: 0,
        exactR: 0,
        exactTheta: 0
      },

      // Student Guesses
      userAnswer: {
        fx: 0,
        fy: 0,
        rmag: 0,
        rangle: 0
      }
    };

    // DOM References
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const container = document.getElementById("canvas-container");

    const tabComponents = document.getElementById("tab-components");
    const tabResultant = document.getElementById("tab-resultant");
    const missionText = document.getElementById("mission-text");

    const inputsComponents = document.getElementById("inputs-components");
    const inputsResultant = document.getElementById("inputs-resultant");
    const userFxInput = document.getElementById("user-fx");
    const userFyInput = document.getElementById("user-fy");
    const userRmagInput = document.getElementById("user-rmag");
    const userRangleInput = document.getElementById("user-rangle");

    const btnAction = document.getElementById("btn-action");
    const solutionBox = document.getElementById("solution-box");
    const evalTitle = document.getElementById("eval-title");
    const evalPoints = document.getElementById("eval-points");
    const evalDesc = document.getElementById("eval-desc");
    const solutionTable = document.getElementById("solution-table");
    const dotCorrect = document.getElementById("dot-correct");

    const valScore = document.getElementById("val-score");
    const valStreak = document.getElementById("val-streak");
    const labelZoomPct = document.getElementById("label-zoom-pct");
    const chkSnap = document.getElementById("chk-snap");

    function degToRad(deg) { return (deg * Math.PI) / 180; }
    function radToDeg(rad) { return (rad * 180) / Math.PI; }
    function getPxPerUnit() { return (state.view.zoom / 15); }

    function worldToScreen(wx, wy) {
      const rect = container.getBoundingClientRect();
      return {
        x: rect.width / 2 + state.view.panX + wx * state.view.zoom,
        y: rect.height / 2 + state.view.panY - wy * state.view.zoom
      };
    }

    function screenToWorld(sx, sy) {
      const rect = container.getBoundingClientRect();
      return {
        x: (sx - (rect.width / 2 + state.view.panX)) / state.view.zoom,
        y: -((sy - (rect.height / 2 + state.view.panY)) / state.view.zoom)
      };
    }

    function resize() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }

    // High-Readability Rounded Badge
    function drawTextBadge(text, x, y, options = {}) {
      ctx.save();
      const font = options.font || "bold 11.5px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.font = font;
      const metrics = ctx.measureText(text);
      const padX = options.padX !== undefined ? options.padX : 6;
      const padY = options.padY !== undefined ? options.padY : 3;
      const w = metrics.width + padX * 2;
      const h = 16 + padY;

      const rx = x - w / 2;
      const ry = y - h / 2;
      const r = 4;

      ctx.fillStyle = options.bgColor || "#ffffff";
      ctx.strokeStyle = options.borderColor || "#cbd5e1";
      ctx.lineWidth = options.borderWidth || 1.2;

      ctx.beginPath();
      ctx.moveTo(rx + r, ry);
      ctx.lineTo(rx + w - r, ry);
      ctx.quadraticCurveTo(rx + w, ry, rx + w, ry + r);
      ctx.lineTo(rx + w, ry + h - r);
      ctx.quadraticCurveTo(rx + w, ry + h, rx + w - r, ry + h);
      ctx.lineTo(rx + r, ry + h);
      ctx.quadraticCurveTo(rx, ry + h, rx, ry + h - r);
      ctx.lineTo(rx, ry + r);
      ctx.quadraticCurveTo(rx, ry, rx + r, ry);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = options.textColor || "#0f172a";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y + 0.5);
      ctx.restore();
    }

    function drawArrow(fromX, fromY, toX, toY, color, width = 3, headLen = 14, isDashed = false) {
      const angle = Math.atan2(toY - fromY, toX - fromX);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      if (isDashed) ctx.setLineDash([5, 4]);

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Grid Renderer
    function drawGrid() {
      const rect = container.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const zoom = state.view.zoom;

      ctx.clearRect(0, 0, w, h);

      const screenStep = zoom * state.view.gridSize;
      const subStep = screenStep / 5;
      const cx = w / 2 + state.view.panX;
      const cy = h / 2 + state.view.panY;

      // Millimeter graph subdivisions
      ctx.lineWidth = 0.5;
      ctx.strokeStyle = "#eef2f6";
      ctx.beginPath();
      for (let x = cx % subStep; x < w; x += subStep) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let y = cy % subStep; y < h; y += subStep) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();

      // Major grid
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#cbd5e1";
      ctx.beginPath();
      for (let x = cx % screenStep; x < w; x += screenStep) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let y = cy % screenStep; y < h; y += screenStep) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();

      // Main Axes
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = "#475569";
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(w, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();

      drawTextBadge("+x (0°)", w - 42, cy - 15, { textColor: "#475569", borderColor: "#cbd5e1" });
      drawTextBadge("+y (90°)", cx + 42, 18, { textColor: "#475569", borderColor: "#cbd5e1" });
      drawTextBadge("-x (180°)", 44, cy - 15, { textColor: "#475569", borderColor: "#cbd5e1" });
      drawTextBadge("-y (270°)", cx + 45, h - 18, { textColor: "#475569", borderColor: "#cbd5e1" });
      drawTextBadge("O(0,0)", cx - 28, cy + 18, { textColor: "#475569", borderColor: "#cbd5e1" });
    }

    // Geometry Helpers
    function getForceEndpoints(force) {
      const rad = degToRad(force.angle);
      const appScreen = worldToScreen(0, 0);
      const lenPx = force.magnitude * getPxPerUnit();
      const dx = lenPx * Math.cos(rad);
      const dy = -lenPx * Math.sin(rad);

      const outerScreen = { x: appScreen.x + dx, y: appScreen.y + dy };
      let fromScreen, toScreen;

      if (force.sense === "pulling") {
        fromScreen = { x: appScreen.x, y: appScreen.y };
        toScreen = { x: outerScreen.x, y: outerScreen.y };
      } else {
        // Compression: shaft identical, points into P
        fromScreen = { x: outerScreen.x, y: outerScreen.y };
        toScreen = { x: appScreen.x, y: appScreen.y };
      }
      return { appScreen, outerScreen, fromScreen, toScreen };
    }

    function drawAngleArc(force, origin, radius = 40) {
      const thetaDeg = ((force.angle % 360) + 360) % 360;

      // Determine closest principal axis
      let baseDeg = 0, axisName = "+x", diff = 0;
      if (thetaDeg <= 45) {
        baseDeg = 0; axisName = "+x"; diff = thetaDeg;
      } else if (thetaDeg <= 135) {
        baseDeg = 90; axisName = "+y"; diff = thetaDeg - 90;
      } else if (thetaDeg <= 225) {
        baseDeg = 180; axisName = "-x"; diff = thetaDeg - 180;
      } else if (thetaDeg <= 315) {
        baseDeg = 270; axisName = "-y"; diff = thetaDeg - 270;
      } else {
        baseDeg = 360; axisName = "+x"; diff = thetaDeg - 360;
      }

      const acuteAngle = Math.round(Math.abs(diff));
      const baseCanvasAngle = -degToRad(baseDeg);
      const targetCanvasAngle = -degToRad(thetaDeg);

      ctx.save();

      // Dashed baseline along the closest axis
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(
        origin.x + (radius + 22) * Math.cos(baseCanvasAngle),
        origin.y + (radius + 22) * Math.sin(baseCanvasAngle)
      );
      ctx.stroke();

      if (acuteAngle >= 1) {
        const isAnticlockwise = diff > 0;
        ctx.setLineDash([]);
        ctx.strokeStyle = force.color;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(origin.x, origin.y, radius, baseCanvasAngle, targetCanvasAngle, isAnticlockwise);
        ctx.stroke();

        // Badge on bisector
        const midAngle = -degToRad(baseDeg + diff / 2);
        const badgeX = origin.x + (radius + 16) * Math.cos(midAngle);
        const badgeY = origin.y + (radius + 16) * Math.sin(midAngle);

        drawTextBadge(`${acuteAngle}° to ${axisName}`, badgeX, badgeY, {
          textColor: force.color,
          borderColor: force.color + "70",
          font: "bold 11px sans-serif",
          padX: 4,
          padY: 2
        });
      } else {
        const badgeX = origin.x + (radius + 14) * Math.cos(baseCanvasAngle);
        const badgeY = origin.y + (radius + 14) * Math.sin(baseCanvasAngle);
        drawTextBadge(`on ${axisName}`, badgeX, badgeY, {
          textColor: force.color,
          borderColor: force.color + "70"
        });
      }

      ctx.restore();
    }
    
    // --- Challenge Generation ---
    function generateChallenge() {
      state.submitted = false;
      solutionBox.style.display = "none";
      btnAction.textContent = "Check Answer";
      btnAction.className = "btn btn-submit";

      // Angles with recognizable statics proportions
      const cleanAngles = [30, 45, 60, 120, 135, 150, 210, 225, 240, 300, 315, 330];
      const magnitudes = [30, 40, 50, 60, 75, 80, 100];
      const senses = ["pulling", "pulling", "pushing"]; // 67% pulling, 33% pushing

      if (state.mode === "components") {
        // Mode 1: Single Force Decomposition
        const mag = magnitudes[Math.floor(Math.random() * magnitudes.length)];
        const angle = cleanAngles[Math.floor(Math.random() * cleanAngles.length)];
        const sense = senses[Math.floor(Math.random() * senses.length)];

        state.challenge.f1 = {
          name: "F",
          magnitude: mag,
          angle: angle,
          sense: sense,
          color: GIVEN_COLOR_1
        };

        const rad = degToRad(angle);
        const sign = sense === "pushing" ? -1 : 1;
        state.challenge.exactFx = sign * mag * Math.cos(rad);
        state.challenge.exactFy = sign * mag * Math.sin(rad);

        // Reset user guesses
        state.userAnswer.fx = 0;
        state.userAnswer.fy = 0;
        userFxInput.value = "";
        userFyInput.value = "";

        missionText.innerHTML = `Given force <strong>F = ${mag} kN</strong> at <strong>&theta; = ${angle}&deg;</strong> (${sense === 'pushing' ? 'Compression / Pushing' : 'Tension / Pulling'}). Draw and input its rectangular components <strong>F<sub>x</sub></strong> and <strong>F<sub>y</sub></strong>.`;
        dotCorrect.style.background = CORRECT_COLOR;

      } else {
        // Mode 2: Resultant of 2 Concurrent Forces
        const mag1 = magnitudes[Math.floor(Math.random() * magnitudes.length)];
        const angle1 = cleanAngles[Math.floor(Math.random() * (cleanAngles.length / 2))]; // Quadrant 1 or 2
        const sense1 = senses[Math.floor(Math.random() * senses.length)];

        const mag2 = magnitudes[Math.floor(Math.random() * magnitudes.length)];
        const angle2 = cleanAngles[Math.floor(Math.random() * (cleanAngles.length / 2)) + (cleanAngles.length / 2)]; // Quadrant 3 or 4
        const sense2 = senses[Math.floor(Math.random() * senses.length)];

        state.challenge.f1 = { name: "F1", magnitude: mag1, angle: angle1, sense: sense1, color: GIVEN_COLOR_1 };
        state.challenge.f2 = { name: "F2", magnitude: mag2, angle: angle2, sense: sense2, color: GIVEN_COLOR_2 };

        const rad1 = degToRad(angle1);
        const sign1 = sense1 === "pushing" ? -1 : 1;
        const f1x = sign1 * mag1 * Math.cos(rad1);
        const f1y = sign1 * mag1 * Math.sin(rad1);

        const rad2 = degToRad(angle2);
        const sign2 = sense2 === "pushing" ? -1 : 1;
        const f2x = sign2 * mag2 * Math.cos(rad2);
        const f2y = sign2 * mag2 * Math.sin(rad2);

        const rx = f1x + f2x;
        const ry = f1y + f2y;

        state.challenge.exactFx = rx;
        state.challenge.exactFy = ry;
        state.challenge.exactR = Math.sqrt(rx * rx + ry * ry);
        state.challenge.exactTheta = (radToDeg(Math.atan2(ry, rx)) + 360) % 360;

        // Reset user guesses
        state.userAnswer.rmag = 0;
        state.userAnswer.rangle = 0;
        userRmagInput.value = "";
        userRangleInput.value = "";

        missionText.innerHTML = `Given concurrent forces <strong>F<sub>1</sub> = ${mag1} kN</strong> (&theta;=${angle1}&deg;) and <strong>F<sub>2</sub> = ${mag2} kN</strong> (&theta;=${angle2}&deg;). Draw the resultant vector <strong>R</strong> and input its magnitude and angle.`;
        dotCorrect.style.background = RESULTANT_COLOR;
      }

      render();
    }

    // --- Submission & Evaluation ---
    function evaluateSubmission() {
      state.submitted = true;
      solutionBox.style.display = "block";
      btnAction.textContent = "Next Challenge →";
      btnAction.className = "btn btn-next";

      let scoreDelta = 0;
      let title = "";
      let desc = "";

      if (state.mode === "components") {
        const uFx = parseFloat(userFxInput.value) || state.userAnswer.fx || 0;
        const uFy = parseFloat(userFyInput.value) || state.userAnswer.fy || 0;

        const errX = Math.abs(uFx - state.challenge.exactFx);
        const errY = Math.abs(uFy - state.challenge.exactFy);
        const tol = Math.max(1.5, state.challenge.f1.magnitude * 0.05); // 5% tolerance

        const correctX = errX <= tol;
        const correctY = errY <= tol;

        if (correctX && correctY) {
          scoreDelta = 100;
          state.streak++;
          solutionBox.className = "solution-panel success";
          title = "Excellent! Perfectly Resolved";
          desc = "Your horizontal and vertical components are accurate within engineering tolerances.";
        } else if (correctX || correctY) {
          scoreDelta = 50;
          solutionBox.className = "solution-panel warning";
          title = "Partially Correct";
          desc = "One of your components is correct, but the other has a magnitude or sign error.";
        } else {
          state.streak = 0;
          solutionBox.className = "solution-panel warning";
          title = "Review Component Signs & Trig";
          desc = "Check your trigonometric projections and the pushing/pulling sense convention.";
        }

        const f = state.challenge.f1;
        const signStr = f.sense === "pushing" ? "−" : "+";
        solutionTable.innerHTML = `
          <tr><td>Given Force:</td><td>${f.magnitude} kN @ ${f.angle}&deg; (${f.sense})</td></tr>
          <tr><td>Your Components:</td><td style="color:${USER_COLOR};">Fx=${uFx.toFixed(1)}, Fy=${uFy.toFixed(1)} kN</td></tr>
          <tr><td>Exact F<sub>x</sub>:</td><td style="color:${CORRECT_COLOR};">${signStr}${f.magnitude}&middot;cos(${f.angle}&deg;) = ${state.challenge.exactFx >= 0 ? '+' : ''}${state.challenge.exactFx.toFixed(2)} kN</td></tr>
          <tr><td>Exact F<sub>y</sub>:</td><td style="color:${CORRECT_COLOR};">${signStr}${f.magnitude}&middot;sin(${f.angle}&deg;) = ${state.challenge.exactFy >= 0 ? '+' : ''}${state.challenge.exactFy.toFixed(2)} kN</td></tr>
        `;

      } else {
        // Mode 2 Resultant
        const uR = parseFloat(userRmagInput.value) || state.userAnswer.rmag || 0;
        const uTheta = parseFloat(userRangleInput.value) || state.userAnswer.rangle || 0;

        const errR = Math.abs(uR - state.challenge.exactR);
        const errTheta = Math.abs(uTheta - state.challenge.exactTheta);
        const tolR = Math.max(2.0, state.challenge.exactR * 0.06);

        if (errR <= tolR && errTheta <= 6.0) {
          scoreDelta = 100;
          state.streak++;
          solutionBox.className = "solution-panel success";
          title = "Outstanding Resultant Guess!";
          desc = "Your magnitude and angle align closely with the vector summation.";
        } else if (errR <= tolR * 2 || errTheta <= 15.0) {
          scoreDelta = 50;
          solutionBox.className = "solution-panel warning";
          title = "Close Estimate!";
          desc = "You captured the general direction, with a slight deviation in magnitude or angle.";
        } else {
          state.streak = 0;
          solutionBox.className = "solution-panel warning";
          title = "Vector Summation Review";
          desc = "Sum the individual rectangular components first before computing R.";
        }

        solutionTable.innerHTML = `
          <tr><td>Your Resultant:</td><td style="color:${USER_COLOR};">|R| = ${uR.toFixed(1)} kN @ ${uTheta.toFixed(1)}&deg;</td></tr>
          <tr><td>&Sigma; F<sub>x</sub> (Horizontal):</td><td>${state.challenge.exactFx.toFixed(2)} kN</td></tr>
          <tr><td>&Sigma; F<sub>y</sub> (Vertical):</td><td>${state.challenge.exactFy.toFixed(2)} kN</td></tr>
          <tr><td>Exact |R|:</td><td style="color:${RESULTANT_COLOR};">&radic;(&Sigma;Fx&sup2; + &Sigma;Fy&sup2;) = ${state.challenge.exactR.toFixed(2)} kN</td></tr>
          <tr><td>Exact Direction &theta;:</td><td style="color:${RESULTANT_COLOR};">${state.challenge.exactTheta.toFixed(1)}&deg; from +x</td></tr>
        `;
      }

      state.score += scoreDelta;
      valScore.textContent = state.score;
      valStreak.textContent = state.streak;
      evalTitle.textContent = title;
      evalPoints.textContent = `+${scoreDelta} pts`;
      evalDesc.textContent = desc;

      render();
    }

    // --- Canvas Rendering Loop ---
    function render() {
      drawGrid();
      const origin = worldToScreen(0, 0);

      // 1. Draw Given Force(s)
      if (state.challenge.f1) {
        const { appScreen, outerScreen, fromScreen, toScreen } = getForceEndpoints(state.challenge.f1);
        drawArrow(fromScreen.x, fromScreen.y, toScreen.x, toScreen.y, state.challenge.f1.color, 3.8, 16);
        drawAngleArc(state.challenge.f1, appScreen, 38);

        const midX = appScreen.x * 0.35 + outerScreen.x * 0.65;
        const midY = appScreen.y * 0.35 + outerScreen.y * 0.65;
        drawTextBadge(
          `${state.challenge.f1.name} = ${state.challenge.f1.magnitude} kN`,
          midX + 18, midY - 14,
          { textColor: state.challenge.f1.color, borderColor: state.challenge.f1.color, borderWidth: 1.5 }
        );
      }

      if (state.mode === "resultant" && state.challenge.f2) {
        const { appScreen, outerScreen, fromScreen, toScreen } = getForceEndpoints(state.challenge.f2);
        drawArrow(fromScreen.x, fromScreen.y, toScreen.x, toScreen.y, state.challenge.f2.color, 3.8, 16);
        drawAngleArc(state.challenge.f2, appScreen, 56);

        const midX = appScreen.x * 0.35 + outerScreen.x * 0.65;
        const midY = appScreen.y * 0.35 + outerScreen.y * 0.65;
        drawTextBadge(
          `${state.challenge.f2.name} = ${state.challenge.f2.magnitude} kN`,
          midX + 18, midY - 14,
          { textColor: state.challenge.f2.color, borderColor: state.challenge.f2.color, borderWidth: 1.5 }
        );
      }

      // Application Point Anchor Pin
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 6, 0, 2 * Math.PI);
      ctx.fillStyle = "#1e293b";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();

      // 2. Draw User's Drawn Answer (Dashed Amber)
      if (state.mode === "components") {
        const pxPerUnit = getPxPerUnit();
        const userPxX = state.userAnswer.fx * pxPerUnit;
        const userPxY = -state.userAnswer.fy * pxPerUnit;

        // User Fx component along x-axis
        if (Math.abs(state.userAnswer.fx) > 0.5) {
          drawArrow(origin.x, origin.y, origin.x + userPxX, origin.y, USER_COLOR, 3.0, 12, true);
          drawTextBadge(`Your Fx: ${state.userAnswer.fx.toFixed(1)} kN`, origin.x + userPxX / 2, origin.y + (state.userAnswer.fx >= 0 ? 20 : -20), {
            textColor: USER_COLOR, borderColor: USER_COLOR + "70", font: "bold 11px monospace"
          });
        }
        // User Fy component along y-axis
        if (Math.abs(state.userAnswer.fy) > 0.5) {
          drawArrow(origin.x, origin.y, origin.x, origin.y + userPxY, USER_COLOR, 3.0, 12, true);
          drawTextBadge(`Your Fy: ${state.userAnswer.fy.toFixed(1)} kN`, origin.x + (state.userAnswer.fy >= 0 ? 44 : -44), origin.y + userPxY / 2, {
            textColor: USER_COLOR, borderColor: USER_COLOR + "70", font: "bold 11px monospace"
          });
        }

        // Draggable interactive handles
        if (!state.submitted) {
          ctx.beginPath();
          ctx.arc(origin.x + userPxX, origin.y, 8, 0, 2 * Math.PI);
          ctx.arc(origin.x, origin.y + userPxY, 8, 0, 2 * Math.PI);
          ctx.strokeStyle = USER_COLOR;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

      } else {
        // User Resultant
        if (state.userAnswer.rmag > 1) {
          const pxPerUnit = getPxPerUnit();
          const rad = degToRad(state.userAnswer.rangle);
          const lenPx = state.userAnswer.rmag * pxPerUnit;
          const tipX = origin.x + lenPx * Math.cos(rad);
          const tipY = origin.y - lenPx * Math.sin(rad);

          drawArrow(origin.x, origin.y, tipX, tipY, USER_COLOR, 3.5, 15, true);
          drawTextBadge(
            `Your R: ${state.userAnswer.rmag.toFixed(0)} kN @ ${state.userAnswer.rangle.toFixed(0)}°`,
            tipX + 16, tipY - 14,
            { textColor: USER_COLOR, borderColor: USER_COLOR, borderWidth: 1.5 }
          );

          if (!state.submitted) {
            ctx.beginPath();
            ctx.arc(tipX, tipY, 8, 0, 2 * Math.PI);
            ctx.strokeStyle = USER_COLOR;
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }
      }

      // 3. Draw Correct Answer (When Submitted)
      if (state.submitted) {
        const pxPerUnit = getPxPerUnit();

        if (state.mode === "components") {
          const corrPxX = state.challenge.exactFx * pxPerUnit;
          const corrPxY = -state.challenge.exactFy * pxPerUnit;

          // Exact Fx along x-axis
          drawArrow(origin.x, origin.y, origin.x + corrPxX, origin.y, CORRECT_COLOR, 3.5, 14);
          drawTextBadge(`Exact Fx: ${state.challenge.exactFx.toFixed(1)} kN`, origin.x + corrPxX / 2, origin.y + (state.challenge.exactFx >= 0 ? -20 : 20), {
            textColor: CORRECT_COLOR, borderColor: CORRECT_COLOR, borderWidth: 1.5, font: "bold 11px monospace"
          });

          // Exact Fy along y-axis
          drawArrow(origin.x, origin.y, origin.x, origin.y + corrPxY, CORRECT_COLOR, 3.5, 14);
          drawTextBadge(`Exact Fy: ${state.challenge.exactFy.toFixed(1)} kN`, origin.x + (state.challenge.exactFy >= 0 ? -48 : 48), origin.y + corrPxY / 2, {
            textColor: CORRECT_COLOR, borderColor: CORRECT_COLOR, borderWidth: 1.5, font: "bold 11px monospace"
          });

        } else {
          // Exact Resultant Vector
          const rad = degToRad(state.challenge.exactTheta);
          const lenPx = state.challenge.exactR * pxPerUnit;
          const tipX = origin.x + lenPx * Math.cos(rad);
          const tipY = origin.y - lenPx * Math.sin(rad);

          drawArrow(origin.x, origin.y, tipX, tipY, RESULTANT_COLOR, 4.8, 18);
          drawTextBadge(
            `Exact R: ${state.challenge.exactR.toFixed(1)} kN @ ${state.challenge.exactTheta.toFixed(1)}°`,
            tipX + 18, tipY + 16,
            { textColor: RESULTANT_COLOR, borderColor: RESULTANT_COLOR, borderWidth: 2, font: "bold 12px sans-serif" }
          );

          // Arc for exact resultant
          const dummyR = { angle: state.challenge.exactTheta, color: RESULTANT_COLOR };
          drawAngleArc(dummyR, origin, 74);
        }
      }
    }

    // --- Dual-Binding Input Events ---
    userFxInput.addEventListener("input", (e) => {
      state.userAnswer.fx = parseFloat(e.target.value) || 0;
      render();
    });

    userFyInput.addEventListener("input", (e) => {
      state.userAnswer.fy = parseFloat(e.target.value) || 0;
      render();
    });

    userRmagInput.addEventListener("input", (e) => {
      state.userAnswer.rmag = Math.max(0, parseFloat(e.target.value) || 0);
      render();
    });

    userRangleInput.addEventListener("input", (e) => {
      let val = parseFloat(e.target.value) || 0;
      state.userAnswer.rangle = ((val % 360) + 360) % 360;
      render();
    });

    // --- Interactive Direct Dragging on Canvas ---
    canvas.addEventListener("mousedown", (e) => {
      if (state.submitted) {
        state.dragMode = 'pan';
        state.dragStart = { x: e.clientX - state.view.panX, y: e.clientY - state.view.panY };
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const mouseScreen = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const origin = worldToScreen(0, 0);
      const pxPerUnit = getPxPerUnit();

      if (state.mode === "components") {
        const hxScreen = { x: origin.x + state.userAnswer.fx * pxPerUnit, y: origin.y };
        const hyScreen = { x: origin.x, y: origin.y - state.userAnswer.fy * pxPerUnit };

        if (Math.hypot(mouseScreen.x - hxScreen.x, mouseScreen.y - hxScreen.y) < 18) {
          state.dragMode = 'userHandle';
          state.activeHandle = 'fx';
          return;
        }
        if (Math.hypot(mouseScreen.x - hyScreen.x, mouseScreen.y - hyScreen.y) < 18) {
          state.dragMode = 'userHandle';
          state.activeHandle = 'fy';
          return;
        }

        // Click anywhere to place components
        state.dragMode = 'userHandle';
        state.activeHandle = (Math.abs(mouseScreen.x - origin.x) > Math.abs(mouseScreen.y - origin.y)) ? 'fx' : 'fy';

      } else {
        // Resultant mode: drag resultant arrow
        state.dragMode = 'userHandle';
        state.activeHandle = 'resultant';
      }

      // Default fallback: pan
      if (!state.dragMode) {
        state.dragMode = 'pan';
        state.dragStart = { x: e.clientX - state.view.panX, y: e.clientY - state.view.panY };
      }
    });

    window.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseScreen = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const origin = worldToScreen(0, 0);
      const pxPerUnit = getPxPerUnit();

      if (state.dragMode === 'userHandle' && !state.submitted) {
        const dx = mouseScreen.x - origin.x;
        const dy = -(mouseScreen.y - origin.y);

        if (state.mode === "components") {
          if (state.activeHandle === 'fx') {
            let val = dx / pxPerUnit;
            if (state.options.snapToGrid) val = Math.round(val / 5) * 5;
            state.userAnswer.fx = val;
            userFxInput.value = val.toFixed(1);
          } else if (state.activeHandle === 'fy') {
            let val = dy / pxPerUnit;
            if (state.options.snapToGrid) val = Math.round(val / 5) * 5;
            state.userAnswer.fy = val;
            userFyInput.value = val.toFixed(1);
          }
        } else {
          // Resultant
          let mag = Math.hypot(dx, dy) / pxPerUnit;
          let deg = (radToDeg(Math.atan2(dy, dx)) + 360) % 360;

          if (state.options.snapToGrid) {
            mag = Math.round(mag / 5) * 5;
            deg = Math.round(deg / 5) * 5;
          }

          state.userAnswer.rmag = Math.max(0, mag);
          state.userAnswer.rangle = (deg + 360) % 360;
          userRmagInput.value = state.userAnswer.rmag.toFixed(0);
          userRangleInput.value = state.userAnswer.rangle.toFixed(0);
        }

        render();
        return;
      }

      if (state.dragMode === 'pan') {
        state.view.panX = e.clientX - state.dragStart.x;
        state.view.panY = e.clientY - state.dragStart.y;
        render();
      }
    });

    window.addEventListener("mouseup", () => {
      state.dragMode = null;
      state.activeHandle = null;
    });

    // Cursor-Centric Zoom
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const worldPos = screenToWorld(mouseX, mouseY);

      const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
      const newZoom = Math.max(12, Math.min(320, state.view.zoom * factor));
      if (newZoom === state.view.zoom) return;

      state.view.zoom = newZoom;
      state.view.panX = mouseX - rect.width / 2 - worldPos.x * newZoom;
      state.view.panY = -(mouseY - rect.height / 2) - worldPos.y * newZoom;

      labelZoomPct.textContent = `${Math.round((state.view.zoom / BASE_ZOOM) * 100)}%`;
      render();
    }, { passive: false });

    // --- Mode Tab Switching ---
    tabComponents.addEventListener("click", () => {
      if (state.mode === "components") return;
      state.mode = "components";
      tabComponents.classList.add("active");
      tabResultant.classList.remove("active");
      inputsComponents.style.display = "block";
      inputsResultant.style.display = "none";
      generateChallenge();
    });

    tabResultant.addEventListener("click", () => {
      if (state.mode === "resultant") return;
      state.mode = "resultant";
      tabResultant.classList.add("active");
      tabComponents.classList.remove("active");
      inputsComponents.style.display = "none";
      inputsResultant.style.display = "block";
      generateChallenge();
    });

    // --- Action Button ---
    btnAction.addEventListener("click", () => {
      if (state.submitted) {
        generateChallenge();
      } else {
        evaluateSubmission();
      }
    });

    // --- Viewport Toolbar Controls ---
    document.getElementById("btn-recenter").addEventListener("click", () => {
      state.view.panX = 0;
      state.view.panY = 0;
      state.view.zoom = BASE_ZOOM;
      labelZoomPct.textContent = "100%";
      render();
    });

    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      state.view.zoom = Math.min(320, state.view.zoom * 1.2);
      labelZoomPct.textContent = `${Math.round((state.view.zoom / BASE_ZOOM) * 100)}%`;
      render();
    });

    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      state.view.zoom = Math.max(12, state.view.zoom * 0.8);
      labelZoomPct.textContent = `${Math.round((state.view.zoom / BASE_ZOOM) * 100)}%`;
      render();
    });

    chkSnap.addEventListener("change", (e) => {
      state.options.snapToGrid = e.target.checked;
    });

    window.addEventListener("resize", resize);

    // Boot
    resize();
    generateChallenge();
  </script>
</body>
</html>
